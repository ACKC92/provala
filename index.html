  form.querySelector('#pe-ttr').focus();

  function close() { back.remove(); if (prev && prev.focus && prev.isConnected) prev.focus(); }
  function fail(msg) { errBox.textContent = msg; errBox.hidden = false; }
  async function submit(e) {
    e.preventDefault();
    const v = id => form.querySelector('#' + id).value;
    const out = {
      id: isNew ? undefined : f.id,
      title: { tr: v('pe-ttr').trim(), en: v('pe-ten').trim() }, message: { tr: v('pe-mtr'), en: v('pe-men') },
      start: v('pe-start'), end: v('pe-end'),
      days: Array.from(form.querySelectorAll('input[name="pe-day"]:checked')).map(x => +x.value),
      dayStart: +v('pe-from'), dayEnd: +v('pe-to'), slot: +v('pe-slot'), duration: +v('pe-dur'),
      deadline: v('pe-deadline'), open: form.querySelector('#pe-open').checked, tz: v('pe-tz').trim()
    };
    if (acan('groups')) out.groups = manyAdminGroups() ? Array.from(form.querySelectorAll('input[name="pe-group"]:checked')).map(x => x.value) : fGroups;
    const problem = !out.title.tr && !out.title.en ? 'vTitle'
      : out.groups && !out.groups.length ? 'vGroups'
      : !out.start || !out.end || out.end < out.start ? 'vDates'
      : D.diff(out.start, out.end) >= 93 ? 'vRange'
      : !out.days.length ? 'vDays'
      : out.dayEnd <= out.dayStart || out.dayStart % out.slot || (out.dayEnd - out.dayStart) % out.slot ? 'vHours' : '';
    if (problem) { fail(t(problem)); return; }
    submitBtn.disabled = true;
    try {
      const r = await api.admin(A.key, 'savePoll', { poll: out });
      // The planner already has everything else, so the list is updated here instead of asked for again.
      const i = A.polls.findIndex(x => x.id === r.poll.id);
      if (i === -1) A.polls.push(r.poll); else A.polls[i] = r.poll;
      A.polls.sort((x, y) => (x.start < y.start ? 1 : x.start > y.start ? -1 : 0));
      takeGroups(r);
      if (A.data && A.data.poll.id === r.poll.id) { A.data.poll = r.poll; A.duration = r.poll.duration || A.duration; A.cell = null; A.hl = null; }
      else if (isNew && A.data) applyAdminPoll({ poll: r.poll, responses: [], members: A.data.members, schedule: { draft: null, published: null }, currentId: r.currentId, current: r.current });
      else await loadAdminPoll(r.poll.id);
      S.loaded = false;
      close();
      toast(t('pollSaved'));
      render();
    } catch (x) { fail(errText(x)); submitBtn.disabled = false; }
  }
  let alsoAtt = null;
  function askDelete() {
    const n = (A.data && A.data.poll.id === f.id) ? A.data.responses.length : (f.answers || 0);
    const nAtt = (A.data && A.data.poll.id === f.id) ? (A.data.attendance || []).length : 0;
    alsoAtt = nAtt ? h('input', { type: 'checkbox', id: 'pe-del-att' }) : null;
    clear(confirmBox).append(h('span', null, t('confirmDeletePoll', { n })),
      alsoAtt ? h('label', { class: 'switch-row del-att' }, alsoAtt, t('delPollAtt', { n: nAtt })) : null,
      h('button', { type: 'button', class: 'btn small danger solid', onclick: doDelete }, t('yesDelete')),
      h('button', { type: 'button', class: 'btn small', onclick: () => { confirmBox.hidden = true; } }, t('keep')));
    confirmBox.hidden = false;
  }
  async function doDelete() {
    try {
      const st = await api.admin(A.key, 'deletePoll', { pollId: f.id, attendance: !!(alsoAtt && alsoAtt.checked) });
      A.season = null;
      A.polls = st.polls; takeGroups(st);
      A.pollId = A.currentId || Object.values(A.current)[0] || (A.polls[0] ? A.polls[0].id : '');
      if (A.pollId) await loadAdminPoll(A.pollId); else A.data = null;
      S.loaded = false;
      close();
      toast(t('pollDeleted'));
      render();
    } catch (x) { fail(errText(x)); }
  }
}

function signOut() {
  store.del('tutti-org');
  store.del('tutti-admin-key');
  Object.assign(A, { key: '', authed: false, data: null, polls: [], keyErr: '', error: null, caps: [], errors: null, season: null });
  render();
}

/* ================================================================ SHELL */
function buildHeader() {
  const v = S.view;
  const hasSchedule = !!S.member && hasMeetings();
  return h('header', { class: 'top' }, h('div', { class: 'wrap top-in' },
    h('a', { class: 'brand', href: '#' }, APP_NAME),
    v === 'admin'
      ? h('span', { class: 'top-label' }, t('planner'))
      : !S.member ? h('span', { class: 'top-label' })
      : h('nav', { class: 'tabs', 'aria-label': t('sections') },
        h('a', { class: 'tab', href: '#', 'aria-current': v === 'member' ? 'page' : null }, t('tabAvailability')),
        h('a', { class: 'tab', href: '#schedule', 'aria-current': v === 'schedule' ? 'page' : null }, t('tabSchedule'), hasSchedule ? h('span', { class: 'dot', 'aria-hidden': 'true' }) : null)),
    h('div', { class: 'lang', role: 'group', 'aria-label': t('language') }, ['tr', 'en'].map(l => h('button', {
      type: 'button', lang: l, 'aria-pressed': String(S.lang === l),
      onclick: () => { if (S.lang !== l) { S.lang = l; store.set('tutti-lang', l); render(); } }
    }, l.toUpperCase()))),
    modeButton(),
    v === 'admin' && A.authed ? h('button', { type: 'button', class: 'btn small quiet', onclick: signOut }, t('signOut')) : null,
    v !== 'admin' && S.member ? h('button', { type: 'button', class: 'btn small quiet', onclick: memberSignOut }, t('signOut')) : null));
}

function buildDemoBand() {
  return h('aside', { class: 'demo-band', 'aria-label': t('demoBanner') }, h('div', { class: 'wrap demo-in' },
    h('span', null, t('demoBanner')),
    S.view === 'admin' ? h('a', { href: '#' }, t('demoMember')) : h('a', { href: '#admin' }, t('demoOrganizer')),
    h('button', { type: 'button', class: 'btn small quiet', onclick: () => {
      window.ProvalaDemo.reset();
      store.keys().filter(k => /^tutti-(token|draft|admin|session|org|page)/.test(k)).forEach(k => store.del(k));
      Object.assign(A, { key: '', authed: false, data: null, polls: [], pollId: '', keyErr: '', error: null, tab: 'plan', creds: [], caps: [], errors: null, since: {}, season: null });
      endSession();
      S.loaded = false;
      toast(t('demoResetDone'));
      onRoute();
    } }, t('demoReset'))));
}

// The header's height (it wraps to two rows on phones) tells sticky bars where to stop.
function syncTopHeight() {
  const top = document.querySelector('.top');
  if (!top) return;
  // On phones the header scrolls away with the page, so it takes no room from sticky bars.
  const stays = getComputedStyle(top).position === 'sticky';
  document.documentElement.style.setProperty('--top-h', (stays ? top.offsetHeight : 0) + 'px');
  fitStick();
}
window.addEventListener('resize', syncTopHeight);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncTopHeight);

// Draws the whole page. If that ever fails, the safety net (top of the page) shows a message instead of a half-empty page.
function render() {
  try { drawPage(); } catch (e) { if (window.provalaFail) window.provalaFail(e); else throw e; }
}
function drawPage() {
  document.documentElement.lang = S.lang;
  applyMode();
  document.title = t('docTitle');
  const app = clear(document.getElementById('app'));
  for (const k of Object.keys(R)) delete R[k];
  app.append(buildHeader());
  if (isDemo) app.append(buildDemoBand());
  const main = h('main', { class: 'wrap main' + (S.view === 'admin' ? ' main-admin' : ''), id: 'main' });
  app.append(main);
  // Every page sits on one framed sheet of parchment; members' pages open with the banner.
  const folio = h('div', { class: 'folio' });
  main.append(folio);
  // On the day-picking page the banner hides behind a small box; the sign-in and schedule pages show it as is.
  if (S.view !== 'admin') folio.append(buildBanner(!!S.session && !S.needLogin && S.view !== 'schedule'));
  if (S.view === 'admin') renderAdmin(folio);
  else if (S.loading || (!S.loaded && !S.error)) folio.append(stateBlock(t('loading')));
  else if (S.error) folio.append(errorBlock(S.error, () => bootPublic()));
  else if (S.needLogin) renderLogin(folio);
  else if (S.view === 'schedule') renderSchedule(folio);
  else renderMember(folio);
  if (folio.querySelector('.gate')) folio.classList.add('narrow');
  syncTopHeight();
}

// The banner picture is the file banner.webp next to this page. It's only fetched where it shows:
// the sign-in and schedule pages, and the day page once someone opens it.
// One element is kept and moved between renders, so the picture never flickers.
// On the day-picking page it starts hidden behind a small box so the calendar comes first; a press shows it until the page is reloaded.
let bannerEl = null, bannerOpen = false, bannerBox = false;
function buildBanner(box) {
  bannerBox = box;
  if (!bannerEl) {
    const pic = h('div', { class: 'banner-pic', id: 'banner-pic', hidden: true },
      h('img', { class: 'banner', width: '1600', height: '533', alt: '', decoding: 'async', onerror: () => { bannerEl.hidden = true; } }));
    const btn = h('button', {
      type: 'button', class: 'banner-toggle', 'aria-controls': 'banner-pic', 'aria-expanded': 'false',
      onclick: () => { bannerOpen = !bannerOpen; syncBanner(); }
    });
    bannerEl = h('div', { class: 'banner-wrap' }, btn, pic);
  }
  syncBanner();
  return bannerEl;
}
function syncBanner() {
  const btn = bannerEl.firstChild, pic = bannerEl.lastChild;
  btn.hidden = !bannerBox;
  btn.textContent = t(bannerOpen ? 'bannerShown' : 'bannerShow');
  btn.setAttribute('aria-expanded', String(bannerOpen));
  pic.hidden = bannerBox && !bannerOpen;
  const img = pic.firstChild;
  img.alt = t('bannerAlt');
  if (!pic.hidden && !img.getAttribute('src')) img.src = BANNER;
}

/* ---------- Day and night */
function applyMode() { document.documentElement.setAttribute('data-mode', S.mode); }
function svgIcon(paths) {
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('focusable', 'false');
  for (const d of paths) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); s.append(p); }
  return s;
}
const MOON = ['M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z'];
const SUN = ['M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8z', 'M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8'];
// Shows the moon by day and the sun by night; a press flips the page and remembers the choice.
function modeButton() {
  const night = S.mode === 'night';
  const label = night ? t('modeDay') : t('modeNight');
  const b = h('button', {
    type: 'button', class: 'mode-btn', 'aria-label': label, title: label,
    onclick: () => {
      S.mode = night ? 'day' : 'night';
      store.set('tutti-mode', S.mode);
      applyMode();
      const nb = modeButton();
      b.replaceWith(nb);
      nb.focus();
    }
  });
  b.append(svgIcon(night ? SUN : MOON));
  return b;
}
// Until someone picks day or night themselves, follow the device when it switches.
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const follow = () => {
    if (store.get('tutti-mode')) return;
    S.mode = systemMode();
    applyMode();
    const old = document.querySelector('.mode-btn');
    if (old) old.replaceWith(modeButton());
  };
  if (mq.addEventListener) mq.addEventListener('change', follow); else if (mq.addListener) mq.addListener(follow);
}

function parseRoute() {
  const hsh = location.hash.replace(/^#/, '');
  if (hsh === 'schedule') return { view: 'schedule' };
  if (hsh === 'admin' || hsh === 'organizer') return { view: 'admin' };
  return { view: 'member' };
}
function onRoute() {
  const r = parseRoute();
  const prevView = S.view;
  S.view = r.view;
  if (r.view === 'admin') {
    if (!A.authed && A.key && !A.loading) adminEnter(); else render();
  } else if (!S.loaded && !S.loading) {
    bootPublic();   // draws at once (from the kept copy, or "Loading…"); the fresh copy follows by itself
  } else {
    render();
  }
  if (prevView !== S.view) window.scrollTo(0, 0);
}

// The Provayoyo banner, next to this page on GitHub.
const BANNER = 'banner.webp';

// Problems after start-up are reported too (see the safety net at the top): uncaught errors from this page's own
// code, and failed promises other than the backend's ordinary answers (those are already shown to the person).
const reportWhere = () => (S.view === 'admin' ? 'admin' : S.needLogin ? 'login' : S.view);
window.addEventListener('error', e => {
  if (!window.provalaUp || !window.provalaReport) return;
  const file = (e.filename || '').split('#')[0];
  if (file && file !== location.href.split('#')[0]) return;   // a browser extension, say
  if (!e.error && /^Script error/i.test(e.message || '')) return;
  window.provalaReport(e.error || e.message, reportWhere());
});
window.addEventListener('unhandledrejection', e => {
  if (window.provalaReport && !(e.reason instanceof ApiError)) window.provalaReport(e.reason, reportWhere());
});

window.addEventListener('hashchange', onRoute);
window.addEventListener('beforeunload', e => {
  if (M.dirty && S.poll && S.poll.open) { e.preventDefault(); e.returnValue = ''; }
});
onRoute();
window.provalaUp = true;
})();
</script>
